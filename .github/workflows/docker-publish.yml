name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  GHCR_IMAGE: ghcr.io/libre-7/simplex-bridge
  DOCKERHUB_IMAGE: libre7/simplex-bridge
  PLATFORMS: linux/amd64

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint shell scripts (shellcheck)
        run: |
          shellcheck entrypoint.sh patch-hermes-simplex.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Log in to GHCR early so build-push can push directly ──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Pull from GHCR back to local for Docker Hub re-tagging ──
      - name: Pull images locally for Docker Hub
        run: |
          # Pull each tag we just pushed back to local Docker
          for tag in $(echo '${{ steps.meta.outputs.tags }}' | tr ',' ' '); do
            docker pull "$tag" 2>/dev/null
          done

      # ── Push to Docker Hub ──
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
        id: dh-login

      - name: Push to Docker Hub
        if: steps.dh-login.outcome == 'success'
        run: |
          # Retag and push each tag to Docker Hub
          TAGS=$(docker images ghcr.io/libre-7/simplex-bridge --format '{{.Tag}}' | grep -v '<none>')
          for tag in $TAGS; do
            dh_tag="libre7/simplex-bridge:$tag"
            docker tag "ghcr.io/libre-7/simplex-bridge:$tag" "$dh_tag"
            docker push "$dh_tag"
          done
