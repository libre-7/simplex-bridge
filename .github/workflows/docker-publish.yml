name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/libre-7/simplex-bridge
  DOCKERHUB_IMAGE: libre7/simplex-bridge
  PLATFORMS: linux/amd64

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint shell scripts (shellcheck)
        run: |
          shellcheck entrypoint.sh install-websockets.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: lint

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # ── Log in to GHCR early so build-push can push directly ──
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Docker Hub publish — main and tag pushes only, never PRs ──
      - name: Pull images locally for Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          # Pull each tag we just pushed back to local Docker
          for tag in $(echo '${{ steps.meta.outputs.tags }}' | tr ',' ' '); do
            docker pull "$tag" 2>/dev/null
          done

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
        id: dh-login

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request' && steps.dh-login.outcome == 'success'
        run: |
          # Retag and push each tag to Docker Hub
          TAGS=$(docker images ghcr.io/libre-7/simplex-bridge --format '{{.Tag}}' | grep -v '<none>')
          for tag in $TAGS; do
            dh_tag="libre7/simplex-bridge:$tag"
            docker tag "ghcr.io/libre-7/simplex-bridge:$tag" "$dh_tag"
            docker push "$dh_tag"
          done
