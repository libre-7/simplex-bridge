name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/libre-7/simplex-bridge
  DOCKERHUB_IMAGE: libre7/simplex-bridge
  PLATFORMS: linux/amd64

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint shell scripts (shellcheck)
        run: |
          shellcheck entrypoint.sh install-websockets.sh

  smoke:
    # Builds the image and actually runs it with the same capability set
    # docker-compose.yml uses. Without this, a broken cap_drop/no-new-privileges
    # combination ships green: the entrypoint needs CHOWN+SETUID+SETGID and dies
    # on startup, which lint and build steps cannot detect.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load into local docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: simplex-bridge:smoke
          cache-from: type=gha

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Run container with compose security options
        run: |
          docker volume create simplex-smoke-data
          # Mirror docker-compose.yml exactly: cap_drop ALL + the three caps the
          # entrypoint legitimately needs + no-new-privileges. Bridge networking
          # keeps the daemon's 127.0.0.1:5225 bind inside the container's own netns
          # (the in-container healthcheck still probes it via loopback) and avoids
          # binding a port on the shared runner host.
          docker run -d --name simplex-smoke \
            --network bridge \
            -v simplex-smoke-data:/data \
            --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            simplex-bridge:smoke

      - name: Wait for healthy status
        run: |
          for i in $(seq 1 40); do
            STATE=$(docker inspect --format '{{.State.Health.Status}}' simplex-smoke 2>/dev/null || echo none)
            RUNNING=$(docker inspect --format '{{.State.Running}}' simplex-smoke 2>/dev/null || echo false)
            echo "attempt $i: running=$RUNNING health=$STATE"
            if [ "$STATE" = "healthy" ]; then
              echo "container became healthy"
              docker logs simplex-smoke 2>&1 | tail -20
              exit 0
            fi
            if [ "$RUNNING" != "true" ]; then
              echo "::error::container exited during startup"
              docker logs simplex-smoke 2>&1 | tail -40
              exit 1
            fi
            sleep 3
          done
          echo "::error::container never became healthy"
          docker logs simplex-smoke 2>&1 | tail -40
          exit 1

      - name: Bot address was created
        # Non-fatal by design: the bot address is produced by the first-run
        # setup, which contacts the SimpleX SMP servers. Outbound filtering or
        # a slow/unavailable server in the runner makes this fail even when the
        # image is perfectly healthy — and the entrypoint already treats setup
        # failure as retryable on next start. Healthy status is the real gate.
        continue-on-error: true
        run: |
          ADDR=$(docker exec simplex-smoke cat /data/bot_address.txt 2>/dev/null || echo "")
          if [ -z "$ADDR" ]; then
            echo "::warning::no bot address yet (first-run setup needs outbound access to SimpleX servers)"
            exit 0
          fi
          echo "bot address: ${ADDR:0:60}..."
          case "$ADDR" in
            simplex:/*) echo "bot address looks valid" ;;
            *) echo "::warning::unexpected bot address format: $ADDR" ;;
          esac

      - name: Container logs
        if: always()
        run: docker logs simplex-smoke 2>&1 | tail -40

      - name: Cleanup
        if: always()
        run: |
          docker rm -f simplex-smoke 2>/dev/null || true
          docker volume rm simplex-smoke-data 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: smoke

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # ── Log in to GHCR early so build-push can push directly ──
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Docker Hub publish — main and tag pushes only, never PRs ──
      - name: Pull images locally for Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          # Pull each tag we just pushed back to local Docker
          for tag in $(echo '${{ steps.meta.outputs.tags }}' | tr ',' ' '); do
            docker pull "$tag" 2>/dev/null
          done

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
        id: dh-login

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request' && steps.dh-login.outcome == 'success'
        run: |
          # Retag and push each tag to Docker Hub
          TAGS=$(docker images ghcr.io/libre-7/simplex-bridge --format '{{.Tag}}' | grep -v '<none>')
          for tag in $TAGS; do
            dh_tag="libre7/simplex-bridge:$tag"
            docker tag "ghcr.io/libre-7/simplex-bridge:$tag" "$dh_tag"
            docker push "$dh_tag"
          done
