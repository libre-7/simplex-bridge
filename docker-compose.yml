services:
  simplex-bridge:
    # Pinned to the post-audit build (commit 13f1bb7). The older v1.1.0 tag
    # predates the audit fixes — notably it ships the `cap_drop: ALL`
    # combination that aborts at startup. Update this digest when cutting
    # the next version tag.
    image: ghcr.io/libre-7/simplex-bridge@sha256:1cdd49247fd6ec5f092f935da9638e206504339486b4251516d63c5d506e622a # sha-13f1bb7
    container_name: simplex-bridge
    network_mode: host
    # The entrypoint starts as root because it must (a) chown /data to
    # PUID:PGID and (b) use gosu to drop to the unprivileged simplex user.
    # Both require capabilities, so dropping ALL without restoring these
    # three makes the container abort at startup. No NET_BIND_SERVICE is
    # needed — 5225 is unprivileged, so it binds without extra caps.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - simplex-data:/data
    environment:
      SIMPLEX_DISPLAY_NAME: "Simplex Bridge"
      SIMPLEX_AUTO_ACCEPT: "true"
      SIMPLEX_FILES_ENABLED: "true"
      SIMPLEX_MARK_READ: "true"
      SIMPLEX_TOR: "false"
      TZ: "UTC"
    restart: unless-stopped

volumes:
  simplex-data:
