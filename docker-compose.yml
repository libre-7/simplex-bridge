services:
  simplex-bridge:
    # Pinned to the immutable v1.2.0 release (commit 8aa2c2ce) by digest.
    # v1.1.0 and earlier shipped `cap_drop: ALL` with no `cap_add`, which
    # aborts the container at startup — the entrypoint must chown /data and
    # gosu down to the unprivileged user. Bump this digest when upgrading.
    image: ghcr.io/libre-7/simplex-bridge@sha256:7c2d9cd4e5f3b40cce5c36c7aca9b5de3dd1ab40a14aabb86a64fb9fab7761d4 # v1.2.0
    container_name: simplex-bridge
    network_mode: host
    # The entrypoint starts as root because it must (a) chown /data to
    # PUID:PGID and (b) use gosu to drop to the unprivileged simplex user.
    # Both require capabilities, so dropping ALL without restoring these
    # three makes the container abort at startup. No NET_BIND_SERVICE is
    # needed — 5225 is unprivileged, so it binds without extra caps.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - simplex-data:/data
    environment:
      SIMPLEX_DISPLAY_NAME: "Simplex Bridge"
      SIMPLEX_AUTO_ACCEPT: "true"
      SIMPLEX_FILES_ENABLED: "true"
      SIMPLEX_MARK_READ: "true"
      SIMPLEX_TOR: "false"
      TZ: "UTC"
    restart: unless-stopped

volumes:
  simplex-data:
